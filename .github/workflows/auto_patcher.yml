name: Automated Cloud Patcher

on:
  workflow_dispatch:
    inputs:
      target_package:
        description: 'Target Application Package Name (e.g., com.example.app)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl wget apksigner

      - name: Fetch Dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLI_RES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/revanced/revanced-cli/releases")
          CLI_URL=$(echo "$CLI_RES" | jq -r '.[0].assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          
          if [ -z "$CLI_URL" ] || [ "$CLI_URL" == "null" ]; then
            echo "Critical Error: Failed to extract CLI download URL."
            exit 1
          fi
          wget -qO cli.jar "$CLI_URL"

          PATCHES_RES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/morpheapp/morphe-patches/releases")
          PATCHES_URL=$(echo "$PATCHES_RES" | jq -r '.[0].assets[] | select(.name | test("\\.(jar|rvp)$")) | .browser_download_url' | head -n 1)
          JSON_URL=$(echo "$PATCHES_RES" | jq -r '.[0].assets[] | select(.name | endswith(".json")) | .browser_download_url' | head -n 1)
          
          if [ -z "$PATCHES_URL" ] || [ "$PATCHES_URL" == "null" ]; then
            echo "Critical Error: Failed to extract Patches download URL."
            exit 1
          fi
          
          EXT="${PATCHES_URL##*.}"
          wget -qO "patches.$EXT" "$PATCHES_URL"
          echo "PATCH_FILE=patches.$EXT" >> $GITHUB_ENV
          
          if [ -n "$JSON_URL" ] && [ "$JSON_URL" != "null" ]; then
            wget -qO patches.json "$JSON_URL"
          fi

      - name: Resolve Target Version and Fetch APK
        run: |
          PACKAGE_NAME="${{ github.event.inputs.target_package }}"
          TARGET_VERSION=$(jq -r ".[] | select(.package == \"$PACKAGE_NAME\") | .versions[-1]" patches.json)
          
          if [ -z "$TARGET_VERSION" ] || [ "$TARGET_VERSION" == "null" ]; then
            echo "Failed to resolve target version from patches.json"
            exit 1
          fi
          
          echo "Target Version resolved: $TARGET_VERSION"
          curl -sL "https://api.example-apk-mirror.com/download?package=$PACKAGE_NAME&version=$TARGET_VERSION" -o target.apk

      - name: Execute Patch Process
        run: |
          java -jar cli.jar patch \
            --patches $PATCH_FILE \
            --apk target.apk \
            --out patched_output.apk

      - name: Sign Patched APK
        run: |
          keytool -genkey -v -keystore temp.keystore -alias temp -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Morphe, OU=Patcher, O=Morphe, L=Unknown, ST=Unknown, C=Unknown"
          apksigner sign --ks temp.keystore --ks-pass pass:password --in patched_output.apk --out final_release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patched-${{ github.event.inputs.target_package }}
          path: final_release.apk
          retention-days: 1
