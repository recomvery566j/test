name: Automated Cloud Patcher

on:
  workflow_dispatch:
    inputs:
      target_package:
name: Automated Cloud Patcher

on:
  workflow_dispatch:
    inputs:
      target_package:
        description: 'Target Application Package Name'
        required: true
        type: string
        default: 'com.google.android.youtube'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl wget apksigner unzip

      - name: Fetch Dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          CLI_RES=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/revanced/revanced-cli/releases")
          CLI_URL=$(echo "$CLI_RES" | jq -r '[.[] | select(.assets | length > 0)][0].assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          
          if [ -z "$CLI_URL" ] || [ "$CLI_URL" == "null" ]; then
            exit 1
          fi
          wget -qO cli.jar "$CLI_URL"

          PATCHES_RES=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/morpheapp/morphe-patches/releases")
          PATCHES_URL=$(echo "$PATCHES_RES" | jq -r '[.[] | select(.assets | length > 0)][0].assets[] | select(.name | test("\\.(jar|rvp)$")) | .browser_download_url' | head -n 1)
          JSON_URL=$(echo "$PATCHES_RES" | jq -r '[.[] | select(.assets | length > 0)][0].assets[] | select(.name | endswith(".json")) | .browser_download_url' | head -n 1)

          if [ -z "$PATCHES_URL" ] || [ "$PATCHES_URL" == "null" ]; then
            git clone https://github.com/morpheapp/morphe-patches.git workspace_patches
            cd workspace_patches
            
            echo "gpr.user=$GITHUB_ACTOR" >> gradle.properties
            echo "gpr.key=$GITHUB_TOKEN" >> gradle.properties
            
            chmod +x gradlew
            ./gradlew build
            
            PATCH_OUT=$(find patches/build/libs -type f \( -name "*.jar" -o -name "*.rvp" \) | grep -ivE "(sources|javadoc|test)" | head -n 1 || true)
            EXT="${PATCH_OUT##*.}"
            cp "$PATCH_OUT" "../patches.$EXT"
            
            JSON_OUT=$(find patches/build/libs -type f -name "*.json" | head -n 1 || true)
            if [ -n "$JSON_OUT" ]; then
              cp "$JSON_OUT" ../patches.json
            else
              cp patches-bundle.json ../patches.json
            fi
            
            cd ..
            echo "PATCH_FILE=patches.$EXT" >> $GITHUB_ENV
          else
            EXT="${PATCHES_URL##*.}"
            wget -qO "patches.$EXT" "$PATCHES_URL"
            echo "PATCH_FILE=patches.$EXT" >> $GITHUB_ENV
            
            if [ -n "$JSON_URL" ] && [ "$JSON_URL" != "null" ]; then
              wget -qO patches.json "$JSON_URL"
            fi
          fi

      - name: Resolve Target Version and Fetch APK
        run: |
          PACKAGE_NAME="${{ github.event.inputs.target_package }}"
          
          TARGET_VERSION=$(jq -r '[.[] | objects | .compatiblePackages[]? | objects | select(.name == "'$PACKAGE_NAME'") | .versions[]?] | unique | sort_by(split(".") | map(tonumber? // 0)) | last // empty' patches.json)
          
          if [ -z "$TARGET_VERSION" ] || [ "$TARGET_VERSION" == "null" ]; then
            TARGET_VERSION="21.13.164"
          fi
          
          wget -qO apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep
          
          ./apkeep -a "$PACKAGE_NAME@$TARGET_VERSION" . || curl -sL -A "Mozilla/5.0" "https://d.apkpure.com/b/APK/$PACKAGE_NAME?version=latest" -o "$PACKAGE_NAME@$TARGET_VERSION.apk"
          
          mv "$PACKAGE_NAME@$TARGET_VERSION.apk" target.apk

      - name: Execute Patch Process
        run: |
          java -jar cli.jar patch \
            --patches $PATCH_FILE \
            --apk target.apk \
            --out patched_output.apk

      - name: Sign Patched APK
        run: |
          keytool -genkey -v -keystore temp.keystore -alias temp -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Morphe, OU=Patcher, O=Morphe, L=Unknown, ST=Unknown, C=Unknown"
          apksigner sign --ks temp.keystore --ks-pass pass:password --in patched_output.apk --out final_release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patched-${{ github.event.inputs.target_package }}
          path: final_release.apk
          retention-days: 1

vent.inputs.target_package }}
          path: final_release.apk
          retention-days: 1
